<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Us</title>
<meta name="theme-color" content="#c4657f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fdf5f1;--g1:#ffd9c9;--g2:#e7c8e8;--g3:#c9e4f0;--card:rgba(255,253,252,.72);--brd:rgba(196,101,127,.16);
--ink:#3a2730;--soft:#907781;--acc:#c4657f;--acc2:#e79a8c;--chip:rgba(196,101,127,.09);--sh:0 10px 34px rgba(150,80,100,.10)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#171116;--g1:#3a1f2c;--g2:#241d3a;--g3:#10262f;
--card:rgba(44,33,40,.72);--brd:rgba(255,200,215,.14);--ink:#f5e9ec;--soft:#b49aa4;--acc:#f3a7ba;--acc2:#d98b7e;--chip:rgba(243,167,186,.12);--sh:0 10px 34px rgba(0,0,0,.35)}}
:root[data-theme=dark]{--bg:#171116;--g1:#3a1f2c;--g2:#241d3a;--g3:#10262f;--card:rgba(44,33,40,.72);
--brd:rgba(255,200,215,.14);--ink:#f5e9ec;--soft:#b49aa4;--acc:#f3a7ba;--acc2:#d98b7e;--chip:rgba(243,167,186,.12);--sh:0 10px 34px rgba(0,0,0,.35)}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;color:var(--ink);background:var(--bg);line-height:1.55;
font-family:Nunito,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;
background-image:radial-gradient(60% 45% at 8% 0%,var(--g1) 0%,transparent 70%),radial-gradient(55% 45% at 100% 12%,var(--g2) 0%,transparent 70%),radial-gradient(70% 50% at 50% 100%,var(--g3) 0%,transparent 75%);
background-attachment:fixed}
.wrap{max-width:580px;margin:0 auto;padding:26px 18px 118px}
h1{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:1.85rem;margin:0;letter-spacing:-.01em}
h2{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:1.1rem;margin:0 0 10px}
.sub{color:var(--soft);font-size:.85rem;margin:3px 0 20px}
.card{background:var(--card);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
border:1px solid var(--brd);border-radius:24px;padding:20px;margin-bottom:15px;box-shadow:var(--sh);animation:up .45s both}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.card:nth-child(2){animation-delay:.05s}.card:nth-child(3){animation-delay:.1s}
.tag{display:inline-block;background:var(--chip);color:var(--acc);border-radius:999px;padding:4px 13px;
font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px}
.q{font-family:Fraunces,Georgia,serif;font-size:1.28rem;line-height:1.38;margin:0 0 15px}
textarea,input{width:100%;font:inherit;color:inherit;background:rgba(255,255,255,.4);border:1px solid var(--brd);
border-radius:16px;padding:12px 14px;resize:vertical}
@media(prefers-color-scheme:dark){textarea,input{background:rgba(0,0,0,.2)}}
textarea{min-height:78px}
input:focus,textarea:focus{outline:2px solid var(--acc2);outline-offset:1px}
button{font:inherit;font-weight:800;cursor:pointer;border:0;border-radius:999px;color:#fff;padding:11px 22px;margin-top:11px;
background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 5px 16px rgba(196,101,127,.3);transition:.15s}
button:active{transform:scale(.96)}
button.ghost{background:var(--chip);color:var(--acc);box-shadow:none}
.reply{background:var(--chip);border-radius:16px;padding:13px 15px;margin-top:11px}
.who{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);font-weight:800}
.muted{color:var(--soft);font-size:.88rem}
.note{border-left:3px solid var(--acc2);padding:3px 0 3px 13px;margin:15px 0}
.row{display:flex;gap:10px}.row>*{flex:1}
.big{font-family:Fraunces,Georgia,serif;font-size:2.7rem;line-height:1;
background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.days{display:flex;gap:8px;margin-top:13px}
.dot{width:29px;height:29px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:.7rem;font-weight:800;color:var(--soft)}
.dot.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.ev{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--brd)}
.ev:last-child{border-bottom:0}
.ev b{font-family:Fraunces,Georgia,serif;font-weight:700;color:var(--acc);white-space:nowrap;font-size:1.05rem}
.x{background:none;color:var(--soft);padding:0 7px;margin:0;font-weight:400;box-shadow:none}
.decks{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.deck{border:1px solid var(--brd);border-radius:20px;padding:16px;cursor:pointer;background:var(--chip);text-align:left}
.deck b{display:block;font-family:Fraunces,Georgia,serif;font-size:1.02rem}
.deck span{font-size:.76rem;color:var(--soft)}
.opt{display:block;width:100%;text-align:left;background:rgba(255,255,255,.45);color:var(--ink);
border:1px solid var(--brd);box-shadow:none;font-weight:600;margin-top:9px;padding:13px 16px;border-radius:16px}
@media(prefers-color-scheme:dark){.opt{background:rgba(0,0,0,.2)}}
.opt.good{background:#2fa36b;color:#fff;border-color:transparent}
.opt.bad{background:#d75f6a;color:#fff;border-color:transparent}
.bar{height:6px;background:var(--chip);border-radius:9px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:.3s}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;z-index:9;background:var(--card);
-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--brd);
padding-top:7px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 7px)}
nav button{flex:1;background:none;color:var(--soft);font-size:.72rem;font-weight:800;border-radius:0;
padding:6px 0;margin:0;box-shadow:none;letter-spacing:.02em}
nav button.sel{color:var(--acc)}
nav i{display:block;font-style:normal;font-size:1.25rem;margin-bottom:2px}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="hd">Us</h1><p class="sub" id="sb">a small place for the two of you</p>

  <section id="v-setup" class="hide"><div class="card"><h2>Who's who?</h2>
    <p class="muted">Both names once. Then pick which one is you on this phone.</p>
    <div class="row" style="margin-top:13px"><input id="nA" placeholder="Your name"><input id="nB" placeholder="Their name"></div>
    <button onclick="setup('a')">I'm the first</button> <button class="ghost" onclick="setup('b')">I'm the second</button>
  </div></section>

  <section id="v-today" class="hide">
    <div class="card"><span class="tag">Today's question</span><p class="q" id="qt"></p><div id="mine"></div><div id="theirs"></div></div>
    <div class="card"><h2>Check in</h2><p class="muted" id="stx"></p><div class="big" id="stk">0</div>
      <div class="days" id="dys"></div><button id="cib" onclick="checkin()">I'm thinking of you</button></div>
  </section>

  <section id="v-play" class="hide">
    <div id="picker"><div class="card"><h2>Pick a deck</h2><div class="decks" id="dk"></div></div></div>
    <div id="game" class="hide"><div class="card">
      <div class="bar"><i id="pb"></i></div><p class="q" id="gq"></p><div id="go"></div>
      <p class="muted" id="gx" style="margin-top:12px"></p>
      <button class="ghost" onclick="quit()">Back to decks</button></div></div>
  </section>

  <section id="v-notes" class="hide">
    <div class="card"><h2>Leave a note</h2><textarea id="nt" placeholder="something small and true..."></textarea>
      <button onclick="addNote()">Send it</button></div>
    <div class="card" id="nl"></div>
  </section>

  <section id="v-us" class="hide">
    <div class="card"><h2>Counting down</h2><div id="el"></div>
      <div class="row" style="margin-top:15px"><input id="eL" placeholder="Anniversary"><input id="eD" type="date"></div>
      <button onclick="addEv()">Add</button></div>
    <div class="card"><h2>Sync between phones</h2>
      <p class="muted">Everything lives on your phone. Copy your code, paste it on the other phone to merge.</p>
      <button onclick="exp()">Copy my code</button> <button class="ghost" onclick="imp()">Paste theirs</button>
      <p class="muted" id="who2" style="margin-top:14px"></p><button class="ghost" onclick="swap()">Switch person</button></div>
  </section>
</div>

<nav>
  <button data-v="today" class="sel"><i>&#9728;</i>Today</button>
  <button data-v="play"><i>&#127918;</i>Play</button>
  <button data-v="notes"><i>&#9993;</i>Notes</button>
  <button data-v="us"><i>&#10084;</i>Us</button>
</nav>

<script src="data.js"></script>
<script>
const KEY="us_state_v2",LK="us_me";
let S={names:{a:"",b:""},daily:{},notes:[],marks:{},events:[],best:{}},me=localStorage.getItem(LK),view="today";
let G=null;
const today=()=>new Date().toLocaleDateString("en-CA");
const other=()=>me==="a"?"b":"a";
const nm=k=>S.names[k]||(k==="a"?"You":"Them");
const esc=s=>String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const dayN=()=>{const d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5)};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render()}
try{const l=localStorage.getItem(KEY);if(l)S=Object.assign(S,JSON.parse(l))}catch(e){}

function setup(k){const a=nA.value.trim(),b=nB.value.trim();if(!a||!b)return alert("Both names, please :)");
  S.names={a,b};me=k;localStorage.setItem(LK,k);save()}
function swap(){me=other();localStorage.setItem(LK,me);render()}
function answer(){const t=document.getElementById("ans").value.trim();if(!t)return;
  const d=today();S.daily[d]=S.daily[d]||{};S.daily[d][me]=t;save()}
function addNote(){const t=nt.value.trim();if(!t)return;S.notes.unshift({t,by:me,at:Date.now()});S.notes=S.notes.slice(0,80);nt.value="";save()}
function delNote(i){S.notes.splice(i,1);save()}
function checkin(){const d=today();S.marks[d]=S.marks[d]||{};S.marks[d][me]=1;save()}
function addEv(){const l=eL.value.trim(),d=eD.value;if(!l||!d)return;S.events.push({l,d});
  S.events.sort((x,y)=>x.d<y.d?-1:1);eL.value="";eD.value="";save()}
function delEv(i){S.events.splice(i,1);save()}
function streak(){let n=0,c=new Date();
  for(let i=0;i<400;i++){const m=S.marks[c.toLocaleDateString("en-CA")];
    if(m&&m.a&&m.b)n++;else if(i>0)break;c.setDate(c.getDate()-1)}return n}

function exp(){const s=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  (navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(()=>alert("Code copied — paste it on the other phone."),()=>prompt("Copy this:",s))}
function imp(){const s=prompt("Paste their code:");if(!s)return;
  try{const o=JSON.parse(decodeURIComponent(escape(atob(s.trim()))));
    S.names=o.names||S.names;
    ["daily","marks"].forEach(k=>{for(const d in o[k]||{})S[k][d]=Object.assign({},o[k][d],S[k][d])});
    const seen={};S.notes=S.notes.concat(o.notes||[]).filter(n=>seen[n.at+n.t]?0:(seen[n.at+n.t]=1)).sort((x,y)=>y.at-x.at).slice(0,80);
    const ev={};S.events=S.events.concat(o.events||[]).filter(e=>ev[e.l+e.d]?0:(ev[e.l+e.d]=1)).sort((x,y)=>x.d<y.d?-1:1);
    save();alert("Merged!")}catch(e){alert("That code didn't look right.")}}

function startDeck(k){const q=DECKS[k].q.slice();
  for(let i=q.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[q[i],q[j]]=[q[j],q[i]]}
  G={k,q:q.slice(0,8),i:0,s:0,locked:0};drawG()}
function quit(){G=null;render()}
function pick(n){if(G.locked)return;G.locked=1;const q=G.q[G.i];
  [...go.children].forEach((b,i)=>{if(i===q.a)b.className="opt good";else if(i===n)b.className="opt bad"});
  if(n===q.a)G.s++;gx.textContent=q.x||"";
  setTimeout(()=>{G.i++;G.locked=0;G.i<G.q.length?drawG():endG()},1500)}
function endG(){const b=S.best[G.k]||0;if(G.s>b){S.best[G.k]=G.s}
  pb.style.width="100%";gq.textContent=G.s+" / "+G.q.length;
  go.innerHTML='<p class="muted">'+(G.s===G.q.length?"Flawless. Insufferable, honestly.":G.s>=6?"Strong showing.":G.s>=4?"Respectable.":"Rewatch required.")+'</p>';
  gx.textContent="Best: "+S.best[G.k];G=null;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function drawG(){const q=G.q[G.i];pb.style.width=(G.i/G.q.length*100)+"%";gx.textContent="";
  gq.textContent=q.q;go.innerHTML=q.o.map((o,i)=>'<button class="opt" onclick="pick('+i+')">'+esc(o)+'</button>').join("")}

function render(){
  const ready=S.names.a&&me;
  ["setup","today","play","notes","us"].forEach(v=>document.getElementById("v-"+v).classList.add("hide"));
  document.querySelector("nav").style.display=ready?"flex":"none";
  if(!ready)return document.getElementById("v-setup").classList.remove("hide");
  document.getElementById("v-"+view).classList.remove("hide");
  hd.textContent=nm("a")+" & "+nm("b");

  const d=today(),e=S.daily[d]||{};
  qt.textContent=QS[dayN()%QS.length];
  mine.innerHTML=e[me]?'<div class="reply"><div class="who">'+esc(nm(me))+'</div>'+esc(e[me])+'</div>'
    :'<textarea id="ans" placeholder="your answer..."></textarea><button onclick="answer()">Save</button>';
  theirs.innerHTML=e[other()]?(e[me]?'<div class="reply"><div class="who">'+esc(nm(other()))+'</div>'+esc(e[other()])+'</div>'
    :'<p class="muted" style="margin-top:11px">'+esc(nm(other()))+' answered — write yours to see it.</p>')
    :'<p class="muted" style="margin-top:11px">Waiting on '+esc(nm(other()))+'.</p>';
  const n=streak();stk.textContent=n;
  stx.textContent=n===1?"1 day you've both checked in":n+" days in a row you've both checked in";
  let h="";const c=new Date();c.setDate(c.getDate()-6);
  for(let i=0;i<7;i++){const m=S.marks[c.toLocaleDateString("en-CA")]||{};
    h+='<div class="dot'+(m.a&&m.b?" on":"")+'">'+"SMTWTFS"[c.getDay()]+'</div>';c.setDate(c.getDate()+1)}
  dys.innerHTML=h;
  const dm=S.marks[d]||{};cib.textContent=dm[me]?"Checked in \u2713":"I'm thinking of you";cib.className=dm[me]?"ghost":"";

  picker.classList.toggle("hide",!!G);game.classList.toggle("hide",!G);
  dk.innerHTML=Object.keys(DECKS).map(k=>'<button class="deck" onclick="startDeck(\''+k+'\')"><b>'+DECKS[k].n+
    '</b><span>'+(S.best[k]?"best "+S.best[k]+"/8":DECKS[k].d)+'</span></button>').join("");

  nl.innerHTML=S.notes.length?S.notes.map((x,i)=>'<div class="note"><div class="who">'+esc(nm(x.by))+' &middot; '+
    new Date(x.at).toLocaleDateString()+'<button class="x" onclick="delNote('+i+')">&times;</button></div>'+esc(x.t)+'</div>').join("")
    :'<p class="muted">No notes yet. Be the first.</p>';

  el.innerHTML=S.events.length?S.events.map((x,i)=>{
    const n=Math.round((new Date(x.d+"T00:00")-new Date(today()+"T00:00"))/864e5);
    return '<div class="ev"><span>'+esc(x.l)+'<button class="x" onclick="delEv('+i+')">&times;</button></span><b>'+
    (n>0?n+(n===1?" day":" days"):n===0?"today!":Math.abs(n)+" ago")+'</b></div>'}).join("")
    :'<p class="muted">Add your anniversary, next date night, a trip.</p>';
  who2.textContent="Signed in as "+nm(me)+" on this phone.";
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{view=b.dataset.v;
  document.querySelectorAll("nav button").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");render();scrollTo(0,0)});
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
render();
</script>
</body>
</html>
